<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="pageTitle">Societal Challenges Feed — JharInnovate / SamadhanSetu</title>
  <script src="categories.js"></script>
  <style>
    :root {
      --primary: #1D4ED8;
      --primary-dark: #172554;
      --primary-light: #EFF6FF;
      --accent: #F59E0B;
      --background: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --text-muted: #475569;
      --danger: #DC2626;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
      --shadow-md: 0 4px 12px rgba(15,23,42,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--background); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    .civic-nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; sticky: top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--primary-dark); }
    .brand-logo { width: 36px; height: 36px; background: var(--primary); color: white; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 900; }

    .container { max-width: 1000px; margin: 24px auto; padding: 0 20px; width: 100%; }

    .filter-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .search-input { flex: 1; min-width: 200px; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--border); font-size: 14px; outline: none; }
    .filter-select { padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--border); font-size: 13px; outline: none; background: white; }

    .feed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }
    .challenge-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, box-shadow 0.2s; }
    .challenge-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary); }
    
    .c-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .c-badge { background: var(--primary-light); color: var(--primary); font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
    .c-score { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--primary-dark); font-weight: 900; font-size: 12px; display: flex; align-items: center; justify-content: center; }

    .c-title { font-size: 16px; font-weight: 800; color: var(--primary-dark); margin-bottom: 6px; line-height: 1.3; }
    .c-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
    .c-footer { display: flex; justify-content: space-between; align-items: center; pt-3; border-top: 1px solid var(--border); padding-top: 12px; margin-top: auto; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-md); font-weight: 700; font-size: 13px; text-decoration: none; border: 1px solid transparent; cursor: pointer; }
    .btn-secondary { background: var(--background); color: var(--text); border-color: var(--border); }
    .btn-primary { background: var(--primary); color: white; }
    .lang-toggle { background: var(--primary-light); color: var(--primary); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--primary); font-weight: 800; cursor: pointer; font-size: 12px; }

    .civic-footer { background: var(--surface); border-top: 1px solid var(--border); padding: 20px; text-align: center; margin-top: auto; font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>

  <nav class="civic-nav">
    <a href="index.html" class="brand">
      <div class="brand-logo">J</div>
      <div>
        <div style="font-weight: 900; font-size: 18px;">JharInnovate</div>
        <div style="font-size: 10px; color: var(--text-muted); font-weight: 700;" data-i18n="nav.subtitle">CHALLENGES FEED</div>
      </div>
    </a>
    <div style="display: flex; gap: 10px;">
      <button class="lang-toggle" onclick="toggleLanguage()" id="langToggleBtn">EN | हिंदी</button>
      <a href="index.html" class="btn btn-secondary" data-i18n="nav.home">Home</a>
    </div>
  </nav>

  <div class="container">
    <div style="margin-bottom: 20px;">
      <h1 style="font-size: 26px; font-weight: 900; color: var(--primary-dark);" data-i18n="head.title">Jharkhand Societal Challenges</h1>
      <p style="font-size: 14px; color: var(--text-muted);" data-i18n="head.sub">Explore AI-prioritized community challenges across all 24 districts.</p>
    </div>

    <div class="filter-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="Search challenges, keywords, or districts..." data-i18n-placeholder="search.ph" onkeyup="filterFeed()">
      <select class="filter-select" id="districtFilter" onchange="filterFeed()">
        <option value="" data-i18n="filter.allDistricts">All Districts</option>
        <option value="Ranchi">Ranchi</option>
        <option value="East Singhbhum">East Singhbhum</option>
        <option value="Dhanbad">Dhanbad</option>
        <option value="Bokaro">Bokaro</option>
        <option value="Hazaribagh">Hazaribagh</option>
        <option value="Deoghar">Deoghar</option>
        <option value="Dumka">Dumka</option>
        <option value="Giridih">Giridih</option>
      </select>
      <select class="filter-select" id="categoryFilter" onchange="filterFeed()">
        <option value="" data-i18n="filter.allCategories">All Categories</option>
        <option value="water" data-i18n="cat.water">Water Infrastructure</option>
        <option value="healthcare" data-i18n="cat.health">Healthcare</option>
        <option value="agriculture" data-i18n="cat.agri">Agriculture</option>
        <option value="education" data-i18n="cat.edu">Education</option>
        <option value="infrastructure" data-i18n="cat.infra">Infrastructure</option>
        <option value="sanitation" data-i18n="cat.sanitation">Sanitation</option>
        <option value="energy" data-i18n="cat.energy">Energy</option>
        <option value="urban_development" data-i18n="cat.urban">Urban Development</option>
        <option value="accessibility" data-i18n="cat.access">Accessibility</option>
        <option value="public_administration" data-i18n="cat.pubadmin">Public Administration</option>
        <option value="rural_livelihoods" data-i18n="cat.livelihoods">Rural Livelihoods</option>
        <option value="environment" data-i18n="cat.environment">Environment</option>
        <option value="other" data-i18n="cat.other">Other</option>
      </select>
    </div>

    <div class="feed-grid" id="feedContainer">
      <!-- Rendered by JS -->
    </div>
  </div>

  <footer class="civic-footer">
    <div data-i18n="footer.copy">&copy; 2026 JharInnovate / SamadhanSetu — Open Innovation Feed</div>
  </footer>

  <script>
    const CONFIG = {
      API_BASE_URL: window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:5000/api' : '/api',
      STORAGE_KEYS: { LANG: 'jhar_language' }
    };

    const I18N = {
      en: {
        pageTitle: 'Societal Challenges Feed — JharInnovate / SamadhanSetu',
        nav: { subtitle: 'CHALLENGES FEED', home: 'Home' },
        head: { title: 'Jharkhand Societal Challenges', sub: 'Explore AI-prioritized community challenges across all 24 districts.' },
        search: { ph: 'Search challenges, keywords, or districts...' },
        filter: { allDistricts: 'All Districts', allCategories: 'All Categories' },
        cat: { water: 'Water Infrastructure', agri: 'Agriculture', health: 'Healthcare', energy: 'Clean Energy', waste: 'Waste Management' },
        card: { facingBtn: "👍 +1 Facing this", detailsBtn: 'Details →', noFound: 'No Challenges Found', noFoundSub: 'Try clearing filters or search keywords.' },
        footer: { copy: '© 2026 JharInnovate / SamadhanSetu — Open Innovation Feed' }
      },
      hi: {
        pageTitle: 'सामाजिक चुनौतियां फीड — झारइन्नोवेट / समाधानसेतु',
        nav: { subtitle: 'चुनौतियां फीड', home: 'होम' },
        head: { title: 'झारखंड की सामाजिक चुनौतियां', sub: 'सभी 24 जिलों में एआई-प्राथमिकता प्राप्त सामुदायिक चुनौतियों का अन्वेषण करें।' },
        search: { ph: 'चुनौतियां, कीवर्ड या जिले खोजें...' },
        filter: { allDistricts: 'सभी जिले', allCategories: 'सभी श्रेणियां' },
        cat: { water: 'जल अवसंरचना', agri: 'कृषि', health: 'स्वास्थ्य सेवा', energy: 'स्वच्छ ऊर्जा', waste: 'अपशिष्ट प्रबंधन' },
        card: { facingBtn: '👍 +1 मुझे भी समस्या है', detailsBtn: 'विवरण →', noFound: 'कोई चुनौती नहीं मिली', noFoundSub: 'फ़िल्टर या खोज कीवर्ड साफ़ करने का प्रयास करें।' },
        footer: { copy: '© 2026 झारइन्नोवेट / समाधानसेतु — ओपन इनोवेशन फीड' }
      }
    };

    function getLanguage() { return localStorage.getItem(CONFIG.STORAGE_KEYS.LANG) || 'en'; }
    function t(key) {
      const lang = getLanguage();
      const keys = key.split('.');
      let obj = I18N[lang] || I18N['en'];
      for (const k of keys) {
        if (!obj || obj[k] === undefined) return key;
        obj = obj[k];
      }
      return obj;
    }
    function applyLanguage(lang) {
      const currentLang = lang || getLanguage();
      localStorage.setItem(CONFIG.STORAGE_KEYS.LANG, currentLang);
      document.documentElement.lang = currentLang;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const val = t(key);
        if (val && val !== key) el.textContent = val;
      });

      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        const val = t(key);
        if (val && val !== key) el.placeholder = val;
      });

      const toggleBtn = document.getElementById('langToggleBtn');
      if (toggleBtn) toggleBtn.textContent = currentLang === 'en' ? 'EN | हिंदी' : 'हिंदी | EN';

      filterFeed();
    }
    function toggleLanguage() {
      applyLanguage(getLanguage() === 'en' ? 'hi' : 'en');
    }

    let rawChallenges = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const initialDistrict = urlParams.get('district');
      if (initialDistrict) {
        document.getElementById('districtFilter').value = initialDistrict;
      }

      applyLanguage(getLanguage());

      try {
        const res = await fetch(`${CONFIG.API_BASE_URL}/challenges`);
        const data = await res.json();
        if (res.ok && data.success && data.data) {
          rawChallenges = data.data;
          filterFeed();
        }
      } catch (err) {}
    });

    function filterFeed() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const dist = document.getElementById('districtFilter').value;
      const cat = document.getElementById('categoryFilter').value;

      const container = document.getElementById('feedContainer');
      let filtered = rawChallenges;

      if (q) {
        filtered = filtered.filter(c => (c.title || '').toLowerCase().includes(q) || (c.description || '').toLowerCase().includes(q));
      }
      if (dist) {
        filtered = filtered.filter(c => c.location && c.location.district === dist);
      }
      if (cat) {
        filtered = filtered.filter(c => typeof normalizeCategoryValue === 'function' ? normalizeCategoryValue(c.category) === cat : c.category === cat);
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 48px; background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border);">
            <div style="font-size: 36px; margin-bottom: 8px;">🔍</div>
            <div style="font-weight: 800; font-size: 16px;">${t('card.noFound')}</div>
            <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">${t('card.noFoundSub')}</div>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(c => `
        <div class="challenge-card">
          <div>
            <div class="c-header">
              <span class="c-badge">${typeof getCategoryLabel === 'function' ? getCategoryLabel(c.category, getLanguage()) : (c.category || 'General')}</span>
              <div class="c-score" title="Groq AI Priority Score">${c.priorityScore || 50}</div>
            </div>
            <div class="c-title">${c.title}</div>
            <div class="c-meta">📍 ${(c.location && c.location.district) ? c.location.district : 'Ranchi'}, Jharkhand</div>
          </div>
          <div class="c-footer">
            <button class="btn btn-secondary" onclick="alert('${getLanguage() === 'hi' ? 'संकेत देने के लिए धन्यवाद कि आपको भी यह समस्या है!' : 'Thank you for indicating you face this issue too!'}')">${t('card.facingBtn')}</button>
            <a href="challenge.html?id=${c._id}" class="btn btn-primary">${t('card.detailsBtn')}</a>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
