<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Profile | Societal Innovation Jharkhand</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="citizen" data-active="profile"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Citizen Profile"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">Citizen Profile</h2>
          <p class="page-subtitle">Manage your contact information and personal details</p>
        </div>
      </div>

      <div class="card" style="max-width: 640px;">
        <form id="profileForm">
          <div class="form-group">
            <label class="form-label" for="name">Full Name <span class="required">*</span></label>
            <input type="text" id="name" class="form-control" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-control" readonly disabled style="background-color:var(--bg-app);" />
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile number" />
          </div>

          <div class="form-group">
            <label class="form-label" for="district">District in Jharkhand</label>
            <select id="district" class="form-select">
              <option value="Ranchi">Ranchi</option>
              <option value="Dhanbad">Dhanbad</option>
              <option value="East Singhbhum (Jamshedpur)">East Singhbhum (Jamshedpur)</option>
              <option value="Hazaribagh">Hazaribagh</option>
              <option value="Khunti">Khunti</option>
              <option value="Bokaro">Bokaro</option>
              <option value="Giridih">Giridih</option>
              <option value="Deoghar">Deoghar</option>
              <option value="Dumka">Dumka</option>
              <option value="Palamu">Palamu</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="organization">Organization / Village Community</label>
            <input type="text" id="organization" class="form-control" placeholder="Panchayat / NGO / Self-Help Group (optional)" />
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top:10px;">Save Profile Changes</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Common.requireRole(['citizen'])) return;
      const user = Common.getUser();
      if (user) {
        document.getElementById('name').value = user.name || '';
        document.getElementById('email').value = user.email || '';
        document.getElementById('phone').value = user.phone || '';
        document.getElementById('district').value = user.location?.district || 'Ranchi';
        document.getElementById('organization').value = user.organization || '';
      }

      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const res = await API.put(`/users/${user.id}`, {
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            organization: document.getElementById('organization').value,
            location: { district: document.getElementById('district').value, state: 'Jharkhand' }
          });
          if (res.success) {
            Common.setAuth(Common.getToken(), res.data);
            Common.showToast('Profile updated successfully!', 'success');
          }
        } catch (err) {
          Common.showToast(err.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
