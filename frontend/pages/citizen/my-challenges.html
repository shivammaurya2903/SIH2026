<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Challenges | JharInnovate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
    <link rel="stylesheet" href="../../css/pages/challenges.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="dashboard-main">
            <header class="dashboard-header" id="header"></header>

            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <span class="section-label">CITIZEN PORTAL</span>
                        <h1>My Submitted Challenges</h1>
                        <p>Track progress, university assignments, and impact status of your submitted challenges.</p>
                    </div>
                    <a href="submit-challenge.html" class="btn btn-primary">
                        <i data-lucide="plus"></i>
                        Report New Challenge
                    </a>
                </div>

                <!-- Filters & Search Bar -->
                <div class="filter-bar card">
                    <div class="search-input">
                        <i data-lucide="search"></i>
                        <input type="search" id="challengeSearch" placeholder="Search by title, location or ID...">
                    </div>

                    <div class="filter-group">
                        <select id="domainFilter" class="filter-select">
                            <option value="">All Domains</option>
                            <option value="Agriculture">Agriculture</option>
                            <option value="Education">Education</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Water">Water</option>
                            <option value="Environment">Environment</option>
                            <option value="Energy">Energy</option>
                            <option value="Accessibility">Accessibility</option>
                        </select>

                        <select id="statusFilter" class="filter-select">
                            <option value="">All Statuses</option>
                            <option value="Submitted">Submitted</option>
                            <option value="Under Review">Under Review</option>
                            <option value="Validated">Validated</option>
                            <option value="Assigned">Assigned</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Resolved">Resolved</option>
                        </select>
                    </div>
                </div>

                <!-- Challenge Items Grid / List -->
                <section class="card dashboard-panel">
                    <div class="panel-header">
                        <div>
                            <h2>Submitted Challenges</h2>
                            <p>Real-time status updates from AI matching and partner institutions.</p>
                        </div>
                    </div>
                    <div id="myChallenges" class="challenge-list"></div>
                </section>
            </main>
        </div>
    </div>

    <!-- Global Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/demo-data.js"></script>

    <script src="../../js/utils/helpers.js"></script>
    <script src="../../js/utils/formatters.js"></script>
    <script src="../../js/utils/validators.js"></script>
    <script src="../../js/utils/storage.js"></script>
    <script src="../../js/utils/debounce.js"></script>
    <script src="../../js/utils/permissions.js"></script>

    <script src="../../js/components/toast.js"></script>
    <script src="../../js/components/modal.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/header.js"></script>
    <script src="../../js/components/table.js"></script>

    <script src="../../js/navigation.js"></script>
    <script src="../../js/pages/challenges.js"></script>
</body>
</html>
