<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Citizen Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="citizen" data-active="settings"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Account Settings"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">Account Settings</h2>
          <p class="page-subtitle">Configure notification preferences and security settings</p>
        </div>
      </div>

      <div class="card" style="max-width: 640px;">
        <h3 class="card-title" style="margin-bottom:16px;">Preferences</h3>
        
        <div class="form-group" style="flex-direction:row; align-items:center; justify-content:space-between;">
          <div>
            <strong style="font-size:0.9rem;">Email Notifications</strong>
            <p style="font-size:0.8rem; color:var(--text-muted);">Receive alerts when government officers review your challenge</p>
          </div>
          <input type="checkbox" checked style="width:20px; height:20px; accent-color:var(--primary);" />
        </div>

        <div style="border-top:1px solid var(--border-light); margin:20px 0; padding-top:20px;">
          <h3 class="card-title" style="margin-bottom:16px;">Password & Security</h3>
          <form id="passwordForm">
            <div class="form-group">
              <label class="form-label">Current Password</label>
              <input type="password" class="form-control" placeholder="••••••••" required />
            </div>
            <div class="form-group">
              <label class="form-label">New Password</label>
              <input type="password" class="form-control" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn btn-secondary" style="margin-top:8px;">Update Password</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Common.requireRole(['citizen'])) return;
      document.getElementById('passwordForm').addEventListener('submit', (e) => {
        e.preventDefault();
        Common.showToast('Password updated successfully', 'success');
      });
    });
  </script>
</body>
</html>
