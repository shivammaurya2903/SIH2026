<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge Details | Citizen Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="citizen" data-active="my-challenges"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Challenge Lifecycle Overview"></header>
    <main class="app-content">
      <div id="breadcrumbContainer"></div>
      <div id="challengeDetailCard">
        <div style="text-align:center; padding:40px;">Loading challenge details...</div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Common.requireRole(['citizen', 'admin'])) return;
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        window.location.href = 'my-challenges.html';
        return;
      }

      document.getElementById('breadcrumbContainer').innerHTML = Components.renderBreadcrumb([
        { label: 'My Challenges', href: 'my-challenges.html' },
        { label: 'Challenge Details' }
      ]);

      try {
        const res = await API.get(`/challenges/${id}`);
        const card = document.getElementById('challengeDetailCard');

        if (res.success && res.data) {
          const ch = res.data;
          card.innerHTML = `
            <div class="card" style="margin-bottom:20px;">
              <div class="card-header">
                <div>
                  <h2 style="font-size:1.4rem;">${Common.escapeHTML(ch.title)}</h2>
                  <p style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">
                    District: ${Common.escapeHTML(ch.location?.district || 'Jharkhand')}, Block: ${Common.escapeHTML(ch.location?.block || 'General')}
                  </p>
                </div>
                <div>${Components.renderStatusBadge(ch.status)}</div>
              </div>

              <p style="font-size:0.95rem; line-height:1.6; margin-bottom:24px;">${Common.escapeHTML(ch.description)}</p>

              <h4 style="font-size:0.9rem; color:var(--text-muted); margin-bottom:12px;">Lifecycle Progress Timeline</h4>
              ${Components.renderTimeline(ch.status)}
            </div>

            ${Components.renderAIAnalysisCard(ch.aiAnalysis)}
          `;
        }
      } catch (err) {
        Common.showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
