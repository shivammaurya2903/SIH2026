<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details | Industry Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="industry" data-active="projects"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Industry Project View"></header>
    <main class="app-content">
      <div id="breadcrumbContainer"></div>
      <div id="projectDetailCard">
        <div style="text-align:center; padding:40px;">Loading project details...</div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Common.requireRole(['industry', 'admin'])) return;
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        window.location.href = 'projects.html';
        return;
      }

      document.getElementById('breadcrumbContainer').innerHTML = Components.renderBreadcrumb([
        { label: 'Projects', href: 'projects.html' },
        { label: 'Project View' }
      ]);

      try {
        const res = await API.get(`/projects/${id}`);
        const card = document.getElementById('projectDetailCard');
        if (res.success && res.data) {
          const prj = res.data;
          card.innerHTML = `
            <div class="card">
              <div class="card-header">
                <div>
                  <h2 style="font-size:1.3rem;">${Common.escapeHTML(prj.title)}</h2>
                  <p style="font-size:0.85rem; color:var(--text-muted);">Lead University: ${Common.escapeHTML(prj.university?.name || 'University')}</p>
                </div>
                <div>${Components.renderStatusBadge(prj.status)}</div>
              </div>
              <p style="font-size:0.95rem; margin-bottom:20px;">${Common.escapeHTML(prj.description)}</p>
              ${Components.renderTimeline(prj.status)}
            </div>
          `;
        }
      } catch (err) {
        Common.showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
