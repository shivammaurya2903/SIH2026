<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Profile | Industry Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="industry" data-active="profile"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Industry Partner Profile"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">Company & CSR Profile</h2>
          <p class="page-subtitle">Manage organization details, technological domains, and CSR interest focus areas</p>
        </div>
      </div>

      <div class="card" style="max-width: 640px;">
        <form id="indProfileForm">
          <div class="form-group">
            <label class="form-label">Company / Organization Name</label>
            <input type="text" id="companyName" class="form-control" placeholder="e.g. Tata Steel Rural Development Society" required />
          </div>
          <div class="form-group">
            <label class="form-label">Organization Type</label>
            <select id="companyType" class="form-select">
              <option value="Enterprise">Enterprise / Public Limited</option>
              <option value="MSME">MSME</option>
              <option value="Startup">Startup / Incubation</option>
              <option value="CSR_Org">CSR Organization / Foundation</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">District Base in Jharkhand</label>
            <input type="text" id="district" class="form-control" placeholder="e.g. East Singhbhum (Jamshedpur)" required />
          </div>
          <div class="form-group">
            <label class="form-label">Key Domain Capabilities (comma-separated)</label>
            <input type="text" id="domains" class="form-control" placeholder="Water Treatment, Solar Energy, Smart Manufacturing" />
          </div>
          <div class="form-group">
            <label class="form-label">CSR Interest Focus Areas</label>
            <input type="text" id="csrInterests" class="form-control" placeholder="Rural Livelihoods, Water Conservation, Technical Education" />
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top:10px;">Save Company Profile</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Common.requireRole(['industry', 'admin'])) return;
      const user = Common.getUser();
      if (user) {
        document.getElementById('companyName').value = user.organization || user.name || '';
      }

      document.getElementById('indProfileForm').addEventListener('submit', (e) => {
        e.preventDefault();
        Common.showToast('Company profile updated successfully!', 'success');
      });
    });
  </script>
</body>
</html>
