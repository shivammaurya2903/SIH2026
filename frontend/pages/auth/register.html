<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Join JharInnovate">
    <title>Register | JharInnovate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <main>
        <section class="auth-page">
            <div class="auth-container">
                <a href="../../index.html" class="brand">
                    <span class="brand-mark"><i data-lucide="zap"></i></span>
                    <span class="brand-text"><strong>Jhar</strong>Innovate</span>
                </a>

                <div class="auth-card">
                    <div class="auth-heading">
                        <span class="section-label">JOIN THE NETWORK</span>
                        <h1>Create your account</h1>
                        <p>Choose your role and become part of Jharkhand's innovation ecosystem.</p>
                    </div>

                    <form id="registerForm">
                        <div class="form-group">
                            <label for="name">Full name</label>
                            <input id="name" name="name" type="text" placeholder="Your full name" required>
                        </div>

                        <div class="form-group">
                            <label for="registerEmail">Email address</label>
                            <input id="registerEmail" name="email" type="email" placeholder="you@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="role">I am joining as</label>
                            <select id="role" name="role" required>
                                <option value="">Select your role</option>
                                <option value="citizen">Citizen</option>
                                <option value="government">Government</option>
                                <option value="university">University</option>
                                <option value="industry">Industry</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="registerPassword">Password</label>
                            <input id="registerPassword" name="password" type="password" placeholder="Create a password" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-large auth-submit">
                            Create Account
                            <i data-lucide="arrow-right"></i>
                        </button>
                    </form>

                    <p class="auth-footer">
                        Already have an account?
                        <a href="login.html">Sign in</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <script src="../../js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
