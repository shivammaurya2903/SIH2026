<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login to JharInnovate">
    <title>Login | JharInnovate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <main>
        <section class="auth-page">
            <div class="auth-container">
                <a href="../../index.html" class="brand">
                    <span class="brand-mark"><i data-lucide="zap"></i></span>
                    <span class="brand-text"><strong>Jhar</strong>Innovate</span>
                </a>

                <div class="auth-card">
                    <div class="auth-heading">
                        <span class="section-label">WELCOME BACK</span>
                        <h1>Sign in to your account</h1>
                        <p>Access your innovation workspace and continue making an impact.</p>
                    </div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label for="email">Email address</label>
                            <input id="email" name="email" type="email" placeholder="you@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input id="password" name="password" type="password" placeholder="Enter your password" required>
                        </div>

                        <div class="form-options">
                            <label class="checkbox-label">
                                <input type="checkbox" id="remember">
                                <span>Remember me</span>
                            </label>

                            <a href="#">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn btn-primary btn-large auth-submit">
                            Sign In
                            <i data-lucide="arrow-right"></i>
                        </button>
                    </form>

                    <div class="auth-divider">
                        <span>OR</span>
                    </div>

                    <p class="auth-footer">
                        Don't have an account?
                        <a href="register.html">Create account</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <script src="../../js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
