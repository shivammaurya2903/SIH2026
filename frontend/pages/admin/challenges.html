<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Challenges | Admin Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="admin" data-active="challenges"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="System Challenges"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">Master Challenges Directory</h2>
          <p class="page-subtitle">View and audit all challenges submitted across Jharkhand</p>
        </div>
      </div>

      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>District</th>
              <th>Priority Score</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="challengesTableBody">
            <tr>
              <td colspan="5" style="text-align:center; padding:30px;">Loading challenges...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Common.requireRole(['admin', 'government'])) return;
      try {
        const res = await API.get('/challenges');
        const tbody = document.getElementById('challengesTableBody');
        if (res.success && res.data && res.data.length > 0) {
          tbody.innerHTML = res.data.map(ch => `
            <tr>
              <td class="table-title-cell">${Common.escapeHTML(ch.title)}</td>
              <td><span class="badge badge-assigned">${Common.escapeHTML(ch.category)}</span></td>
              <td>${Common.escapeHTML(ch.location?.district || 'Jharkhand')}</td>
              <td><strong>${ch.aiAnalysis?.priorityScore || 50}</strong> / 100</td>
              <td>${Components.renderStatusBadge(ch.status)}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="5">${Components.renderEmptyState('No Challenges', 'No challenges submitted yet.')}</td></tr>`;
        }
      } catch (err) {
        console.warn('Error loading challenges:', err.message);
      }
    });
  </script>
</body>
</html>
