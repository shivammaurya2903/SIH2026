<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | JharInnovate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="dashboard-main">
            <header class="dashboard-header" id="header"></header>
            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <span class="section-label">ACCESS CONTROL</span>
                        <h1>User Management</h1>
                        <p>Manage citizens, institutions, government and industry accounts.</p>
                    </div>
                </div>

                <div class="filter-bar card">
                    <div class="search-input">
                        <i data-lucide="search"></i>
                        <input type="search" placeholder="Search users by name or email">
                    </div>
                    <div class="filter-group">
                        <select class="filter-select"><option value="">All Roles</option><option>Citizen</option><option>Government</option><option>University</option><option>Industry</option></select>
                        <select class="filter-select"><option value="">All Statuses</option><option>Active</option><option>Pending</option><option>Suspended</option></select>
                    </div>
                </div>

                <section class="card challenge-list-card">
                    <div id="userTable"></div>
                </section>
            </main>
        </div>
    </div>

    <!-- Global Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/demo-data.js"></script>

    <script src="../../js/utils/helpers.js"></script>
    <script src="../../js/utils/formatters.js"></script>
    <script src="../../js/utils/validators.js"></script>
    <script src="../../js/utils/storage.js"></script>
    <script src="../../js/utils/debounce.js"></script>
    <script src="../../js/utils/permissions.js"></script>

    <script src="../../js/components/toast.js"></script>
    <script src="../../js/components/modal.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/header.js"></script>
    <script src="../../js/components/table.js"></script>

    <script src="../../js/navigation.js"></script>
    <script src="../../js/pages/dashboard.js"></script>
</body>
</html>
