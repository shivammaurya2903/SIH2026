<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Admin Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="admin" data-active="projects"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Master Projects Directory"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">Master Projects Directory</h2>
          <p class="page-subtitle">Track all innovation projects across planning, pilot, and deployment stages</p>
        </div>
      </div>
      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Project Title</th>
              <th>University</th>
              <th>Industry</th>
              <th>Status</th>
              <th>Budget (INR)</th>
            </tr>
          </thead>
          <tbody id="prjTableBody">
            <tr>
              <td colspan="5" style="text-align:center; padding:30px;">Loading projects...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Common.requireRole(['admin', 'government'])) return;
      try {
        const res = await API.get('/projects');
        const tbody = document.getElementById('prjTableBody');
        if (res.success && res.data && res.data.length > 0) {
          tbody.innerHTML = res.data.map(p => `
            <tr>
              <td class="table-title-cell">${Common.escapeHTML(p.title)}</td>
              <td>${Common.escapeHTML(p.university?.name || 'Assigned University')}</td>
              <td>${Common.escapeHTML(p.industry?.name || 'Pending Partner')}</td>
              <td>${Components.renderStatusBadge(p.status)}</td>
              <td>₹${Common.formatNumber(p.budget?.allocated || 0)}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="5">${Components.renderEmptyState('No Projects Found', 'No projects registered yet.')}</td></tr>`;
        }
      } catch (err) {
        console.warn(err.message);
      }
    });
  </script>
</body>
</html>
