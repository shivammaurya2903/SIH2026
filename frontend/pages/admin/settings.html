<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | JharInnovate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="dashboard-main">
            <header class="dashboard-header" id="header"></header>
            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <span class="section-label">PLATFORM CONFIGURATION</span>
                        <h1>System Settings</h1>
                        <p>Configure platform behavior and administration preferences.</p>
                    </div>
                </div>

                <section class="card settings-card">
                    <div class="settings-section">
                        <h2>Platform Settings</h2>
                        <div class="form-group">
                            <label for="platformName">Platform name</label>
                            <input id="platformName" type="text" value="JharInnovate">
                        </div>
                        <div class="form-group">
                            <label for="supportEmail">Support email</label>
                            <input id="supportEmail" type="email" value="support@jharinnovate.org">
                        </div>
                    </div>

                    <div class="settings-section">
                        <h2>Notifications</h2>
                        <label class="setting-toggle">
                            <span><strong>Email notifications</strong><small>Send important platform updates by email.</small></span>
                            <input type="checkbox" checked>
                        </label>
                        <label class="setting-toggle">
                            <span><strong>Challenge alerts</strong><small>Notify administrators about high-priority challenges.</small></span>
                            <input type="checkbox" checked>
                        </label>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-primary">Save Settings</button>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="../../js/navigation.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
    </script>
</body>
</html>
