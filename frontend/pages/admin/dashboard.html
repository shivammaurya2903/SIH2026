<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | JharInnovate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="dashboard-main">
            <header class="dashboard-header" id="header"></header>
            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <span class="section-label">SYSTEM ADMINISTRATION</span>
                        <h1>Admin Dashboard</h1>
                        <p>Manage the platform, users and innovation ecosystem.</p>
                    </div>
                </div>

                <div class="dashboard-stats">
                    <div class="dashboard-stat card"><span class="stat-icon primary"><i data-lucide="users"></i></span><div><strong>28,482</strong><span>Total Users</span></div></div>
                    <div class="dashboard-stat card"><span class="stat-icon green"><i data-lucide="check-circle"></i></span><div><strong>24,120</strong><span>Verified Users</span></div></div>
                    <div class="dashboard-stat card"><span class="stat-icon orange"><i data-lucide="clock"></i></span><div><strong>142</strong><span>Pending Reviews</span></div></div>
                    <div class="dashboard-stat card"><span class="stat-icon purple"><i data-lucide="activity"></i></span><div><strong>99.8%</strong><span>System Health</span></div></div>
                </div>

                <section class="card dashboard-panel">
                    <div class="panel-header">
                        <div><h2>System Overview</h2><p>Platform activity and recent events.</p></div>
                    </div>
                    <div id="adminOverview"></div>
                </section>
            </main>
        </div>
    </div>

    <script src="../../js/navigation.js"></script>
    <script src="../../js/pages/dashboard.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
    </script>
</body>
</html>
