<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge Review | Government Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="government" data-active="challenges"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Government Review Control"></header>
    <main class="app-content">
      <div id="breadcrumbContainer"></div>
      <div id="reviewContainer">
        <div style="text-align:center; padding:40px;">Loading challenge for review...</div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Common.requireRole(['government', 'admin'])) return;
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        window.location.href = 'challenges.html';
        return;
      }

      document.getElementById('breadcrumbContainer').innerHTML = Components.renderBreadcrumb([
        { label: 'Review Challenges', href: 'challenges.html' },
        { label: 'Challenge Approval' }
      ]);

      try {
        const [chalRes, matchRes] = await Promise.all([
          API.get(`/challenges/${id}`),
          API.get(`/challenges/${id}/matches`).catch(() => ({ success: false, data: { matchedUniversities: [], matchedIndustries: [] } }))
        ]);

        const container = document.getElementById('reviewContainer');

        if (chalRes.success && chalRes.data) {
          const ch = chalRes.data;
          const unis = matchRes.data?.matchedUniversities || [];
          const ind = matchRes.data?.matchedIndustries || [];

          container.innerHTML = `
            <!-- Government Action Bar -->
            <div class="card" style="background:var(--primary-soft); border-color:var(--primary-border); margin-bottom:24px;">
              <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;">
                <div>
                  <h3 style="color:var(--primary-dark); font-size:1.1rem;">Government Approval & Routing</h3>
                  <p style="font-size:0.85rem; color:var(--text-body);">Approve to route this challenge to matched higher education institutions and industry partners.</p>
                </div>
                <div style="display:flex; gap:12px;">
                  ${ch.status !== 'approved' ? `
                    <button class="btn btn-success" id="approveBtn">✓ Approve Challenge</button>
                    <button class="btn btn-danger" id="rejectBtn">✕ Reject</button>
                  ` : '<span class="badge badge-deployed" style="font-size:0.9rem; padding:8px 16px;">✓ Approved & Routed to Ecosystem</span>'}
                </div>
              </div>
            </div>

            <div class="card" style="margin-bottom:24px;">
              <div class="card-header">
                <div>
                  <h2 style="font-size:1.4rem;">${Common.escapeHTML(ch.title)}</h2>
                  <p style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">
                    District: ${Common.escapeHTML(ch.location?.district || 'Jharkhand')}, Block: ${Common.escapeHTML(ch.location?.block || 'General')}
                  </p>
                </div>
                <div>${Components.renderStatusBadge(ch.status)}</div>
              </div>
              <p style="font-size:0.95rem; line-height:1.6; margin-bottom:20px;">${Common.escapeHTML(ch.description)}</p>
            </div>

            ${Components.renderAIAnalysisCard(ch.aiAnalysis)}

            <!-- Matched Universities Card -->
            <div class="card" style="margin-bottom:24px;">
              <h3 class="card-title" style="margin-bottom:16px;">Matched Academic Institutions (Groq AI Scored)</h3>
              ${unis.length > 0 ? `
                <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px;">
                  ${unis.map(u => `
                    <div style="padding:16px; border:1px solid var(--border-color); border-radius:var(--radius-md); background:var(--bg-app);">
                      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                        <strong style="font-size:0.95rem;">${Common.escapeHTML(u.university?.name || u.name || 'University')}</strong>
                        <span class="badge badge-in_progress">${u.matchScore || 85}% Match</span>
                      </div>
                      <p style="font-size:0.8rem; color:var(--text-muted);">District: ${Common.escapeHTML(u.university?.district || 'Jharkhand')}</p>
                    </div>
                  `).join('')}
                </div>
              ` : '<p style="font-size:0.85rem; color:var(--text-muted);">No automatic university matches found for this domain.</p>'}
            </div>
          `;

          const approveBtn = document.getElementById('approveBtn');
          if (approveBtn) {
            approveBtn.addEventListener('click', async () => {
              try {
                const res = await API.patch(`/challenges/${id}/approve`);
                if (res.success) {
                  Common.showToast('Challenge approved and routed to universities!', 'success');
                  setTimeout(() => location.reload(), 1000);
                }
              } catch (err) {
                Common.showToast(err.message, 'error');
              }
            });
          }

          const rejectBtn = document.getElementById('rejectBtn');
          if (rejectBtn) {
            rejectBtn.addEventListener('click', async () => {
              try {
                const res = await API.patch(`/challenges/${id}/reject`, { reason: 'Rejected by Government Reviewer' });
                if (res.success) {
                  Common.showToast('Challenge rejected', 'info');
                  setTimeout(() => location.reload(), 1000);
                }
              } catch (err) {
                Common.showToast(err.message, 'error');
              }
            });
          }
        }
      } catch (err) {
        Common.showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
