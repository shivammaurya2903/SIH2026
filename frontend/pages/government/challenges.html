<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenges | JharInnovate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/pages/challenges.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="dashboard-main">
            <header class="dashboard-header" id="header"></header>
            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <span class="section-label">CHALLENGE MANAGEMENT</span>
                        <h1>All Challenges</h1>
                        <p>Review, validate and route societal challenges.</p>
                    </div>
                </div>

                <div class="filter-bar card">
                    <div class="search-field">
                        <i data-lucide="search"></i>
                        <input type="search" placeholder="Search challenges">
                    </div>
                    <select><option>All Domains</option><option>Education</option><option>Agriculture</option><option>Healthcare</option><option>Water</option></select>
                    <select><option>All Districts</option><option>Ranchi</option><option>Dumka</option><option>Deoghar</option></select>
                    <select><option>All Status</option><option>Pending</option><option>Validated</option><option>Assigned</option></select>
                </div>

                <section class="card challenge-list-card">
                    <div id="governmentChallengeTable"></div>
                </section>
            </main>
        </div>
    </div>

    <script src="../../js/navigation.js"></script>
    <script src="../../js/pages/challenges.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
    </script>
</body>
</html>
