<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Government Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="government" data-active="settings"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="System Settings"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">Government Portal Settings</h2>
          <p class="page-subtitle">Configure review routing parameters and security controls</p>
        </div>
      </div>

      <div class="card" style="max-width: 640px;">
        <h3 class="card-title" style="margin-bottom:16px;">Automated Review Thresholds</h3>
        <div class="form-group">
          <label class="form-label">Auto-Flag High Severity Priority Score Cutoff</label>
          <input type="number" value="75" class="form-control" />
        </div>
        <div class="form-group" style="flex-direction:row; align-items:center; justify-content:space-between; margin-top:16px;">
          <div>
            <strong style="font-size:0.9rem;">Auto-Notify Matched Universities</strong>
            <p style="font-size:0.8rem; color:var(--text-muted);">Notify top matched universities when challenge is approved</p>
          </div>
          <input type="checkbox" checked style="width:20px; height:20px; accent-color:var(--primary);" />
        </div>
      </div>
    </main>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Common.requireRole(['government', 'admin'])) return;
    });
  </script>
</body>
</html>
