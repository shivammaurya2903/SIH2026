<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | JharInnovate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/pages/analytics.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="dashboard-main">
            <header class="dashboard-header" id="header"></header>
            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <span class="section-label">DATA & INSIGHTS</span>
                        <h1>Analytics</h1>
                        <p>Understand challenge trends, participation and social impact.</p>
                    </div>
                    <button class="btn btn-primary">
                        <i data-lucide="download"></i>
                        Export Analytics
                    </button>
                </div>

                <div class="analytics-grid">
                    <section class="card chart-card">
                        <div class="panel-header">
                            <div><h2>Challenges by Domain</h2><p>Distribution across major sectors.</p></div>
                        </div>
                        <div id="domainChart" class="chart-placeholder large"></div>
                    </section>

                    <section class="card chart-card">
                        <div class="panel-header">
                            <div><h2>Project Progress</h2><p>Current lifecycle distribution.</p></div>
                        </div>
                        <div id="projectChart" class="chart-placeholder large"></div>
                    </section>

                    <section class="card chart-card full-width">
                        <div class="panel-header">
                            <div><h2>Social Impact</h2><p>People and communities reached through deployed solutions.</p></div>
                        </div>
                        <div id="impactChart" class="chart-placeholder wide"></div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <script src="../../js/navigation.js"></script>
    <script src="../../js/pages/analytics.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
    </script>
</body>
</html>
