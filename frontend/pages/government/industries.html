<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industry & Startup Partners | Government Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="government" data-active="industries"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Industry & MSME Partners"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">Industry & Innovation Network</h2>
          <p class="page-subtitle">Startups, MSMEs, CSR organizations, and research labs supporting technology deployment</p>
        </div>
      </div>

      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Organization</th>
              <th>Type</th>
              <th>District</th>
              <th>Domain Capabilities</th>
              <th>CSR Interests</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="industriesTableBody">
            <tr>
              <td colspan="6" style="text-align:center; padding:30px;">Loading industry partners...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Common.requireRole(['government', 'admin'])) return;
      try {
        const res = await API.get('/industries');
        const tbody = document.getElementById('industriesTableBody');
        if (res.success && res.data && res.data.length > 0) {
          tbody.innerHTML = res.data.map(ind => `
            <tr>
              <td class="table-title-cell">${Common.escapeHTML(ind.name)}</td>
              <td><span class="badge badge-assigned">${Common.escapeHTML(ind.type || 'Industry')}</span></td>
              <td>${Common.escapeHTML(ind.district || 'Jharkhand')}</td>
              <td>${(ind.domains || []).map(d => `<span class="badge badge-in_progress">${Common.escapeHTML(d)}</span>`).join(' ')}</td>
              <td>${(ind.csrInterests || []).join(', ') || 'N/A'}</td>
              <td><span class="badge badge-deployed">Active</span></td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="6">${Components.renderEmptyState('No Industry Partners', 'No industry or startup profiles registered yet.')}</td></tr>`;
        }
      } catch (err) {
        console.warn('Error loading industries:', err.message);
      }
    });
  </script>
</body>
</html>
