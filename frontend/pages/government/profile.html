<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Government Profile | Societal Innovation Jharkhand</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="government" data-active="profile"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Officer Profile"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">Government Representative Profile</h2>
          <p class="page-subtitle">Departmental jurisdiction and officer details</p>
        </div>
      </div>

      <div class="card" style="max-width: 640px;">
        <form id="profileForm">
          <div class="form-group">
            <label class="form-label">Officer Name</label>
            <input type="text" id="name" class="form-control" required />
          </div>
          <div class="form-group">
            <label class="form-label">Official Email</label>
            <input type="email" id="email" class="form-control" readonly disabled style="background-color:var(--bg-app);" />
          </div>
          <div class="form-group">
            <label class="form-label">Department / Agency</label>
            <input type="text" id="organization" class="form-control" placeholder="e.g. Department of Rural Development, Govt of Jharkhand" />
          </div>
          <div class="form-group">
            <label class="form-label">Jurisdiction District</label>
            <input type="text" id="district" class="form-control" value="Statewide (Jharkhand)" />
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top:10px;">Update Officer Profile</button>
        </form>
      </div>
    </main>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Common.requireRole(['government', 'admin'])) return;
      const user = Common.getUser();
      if (user) {
        document.getElementById('name').value = user.name || '';
        document.getElementById('email').value = user.email || '';
        document.getElementById('organization').value = user.organization || 'Department of IT & e-Gov, Govt of Jharkhand';
      }
    });
  </script>
</body>
</html>
