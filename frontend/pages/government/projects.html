<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Monitoring | Government Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="government" data-active="projects"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Active Project Monitoring"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">Societal Projects Monitoring</h2>
          <p class="page-subtitle">Track project progress from planning, prototype, pilot, to state deployment</p>
        </div>
      </div>

      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Project Title</th>
              <th>Challenge Domain</th>
              <th>University Partner</th>
              <th>Industry Partner</th>
              <th>Stage / Status</th>
              <th>Budget (INR)</th>
            </tr>
          </thead>
          <tbody id="projectsTableBody">
            <tr>
              <td colspan="6" style="text-align:center; padding:30px;">Loading projects...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Common.requireRole(['government', 'admin'])) return;
      try {
        const res = await API.get('/projects');
        const tbody = document.getElementById('projectsTableBody');
        if (res.success && res.data && res.data.length > 0) {
          tbody.innerHTML = res.data.map(p => `
            <tr>
              <td class="table-title-cell">${Common.escapeHTML(p.title)}</td>
              <td>${Common.escapeHTML(p.challenge?.category || 'General')}</td>
              <td>${Common.escapeHTML(p.university?.name || 'Assigned University')}</td>
              <td>${Common.escapeHTML(p.industry?.name || 'Pending Industry')}</td>
              <td>${Components.renderStatusBadge(p.status)}</td>
              <td>₹${Common.formatNumber(p.budget?.allocated || 0)}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="6">${Components.renderEmptyState('No Active Projects', 'Projects created from approved university proposals will appear here.')}</td></tr>`;
        }
      } catch (err) {
        console.warn('Error loading projects:', err.message);
      }
    });
  </script>
</body>
</html>
