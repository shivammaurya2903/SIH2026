<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universities & Institutions | Government Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="government" data-active="universities"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Higher Education Institutions"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">University & Research Partners</h2>
          <p class="page-subtitle">Academic institutions participating in societal challenge solutions across Jharkhand</p>
        </div>
      </div>

      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Institution Name</th>
              <th>District</th>
              <th>Key Expertise</th>
              <th>Departments</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="universitiesTableBody">
            <tr>
              <td colspan="6" style="text-align:center; padding:30px;">Loading institutions...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Common.requireRole(['government', 'admin'])) return;
      try {
        const res = await API.get('/universities');
        const tbody = document.getElementById('universitiesTableBody');
        if (res.success && res.data && res.data.length > 0) {
          tbody.innerHTML = res.data.map(u => `
            <tr>
              <td class="table-title-cell">${Common.escapeHTML(u.name)}</td>
              <td>${Common.escapeHTML(u.district || 'Jharkhand')}</td>
              <td>${(u.expertise || []).map(e => `<span class="badge badge-in_progress">${Common.escapeHTML(e)}</span>`).join(' ')}</td>
              <td>${(u.departments || []).join(', ') || 'N/A'}</td>
              <td><span class="badge badge-deployed">Active</span></td>
              <td><button class="btn btn-sm btn-outline">View Profile</button></td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="6">${Components.renderEmptyState('No Universities Registered', 'No academic institutions have registered yet.')}</td></tr>`;
        }
      } catch (err) {
        console.warn('Error loading universities:', err.message);
      }
    });
  </script>
</body>
</html>
