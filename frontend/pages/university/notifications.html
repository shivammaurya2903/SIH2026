<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | University Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="university" data-active="notifications"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Institutional Notifications"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">University Alerts Inbox</h2>
          <p class="page-subtitle">Notifications regarding matched challenges, proposal approvals, and collaboration requests</p>
        </div>
      </div>

      <div class="card">
        <div id="notificationsList">
          <div class="empty-state">
            <div class="empty-icon">🔔</div>
            <h3 class="empty-title">No New Notifications</h3>
            <p class="empty-desc">Alerts for proposal approvals and industry collaboration requests will be shown here.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Common.requireRole(['university', 'faculty', 'student', 'admin'])) return;
    });
  </script>
</body>
</html>
