<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Dashboard | JharInnovate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/pages/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="dashboard-main">
            <header class="dashboard-header" id="header"></header>

            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <span class="section-label">UNIVERSITY PORTAL</span>
                        <h1>Innovation Dashboard</h1>
                        <p>Manage challenges, research teams and solution projects.</p>
                    </div>
                    <a href="challenges.html" class="btn btn-primary">
                        <i data-lucide="search"></i>
                        Explore Challenges
                    </a>
                </div>

                <div class="dashboard-stats">
                    <div class="dashboard-stat card"><span class="stat-icon primary"><i data-lucide="inbox"></i></span><div><strong>48</strong><span>Assigned Challenges</span></div></div>
                    <div class="dashboard-stat card"><span class="stat-icon purple"><i data-lucide="users"></i></span><div><strong>18</strong><span>Active Teams</span></div></div>
                    <div class="dashboard-stat card"><span class="stat-icon green"><i data-lucide="rocket"></i></span><div><strong>24</strong><span>Projects</span></div></div>
                    <div class="dashboard-stat card"><span class="stat-icon orange"><i data-lucide="award"></i></span><div><strong>8</strong><span>Innovations</span></div></div>
                </div>

                <div class="dashboard-grid">
                    <section class="card dashboard-panel">
                        <div class="panel-header">
                            <div><h2>Recommended Challenges</h2><p>AI-matched opportunities based on your expertise.</p></div>
                        </div>
                        <div id="universityChallenges"></div>
                    </section>

                    <section class="card dashboard-panel">
                        <div class="panel-header">
                            <div><h2>Project Progress</h2><p>Current active projects.</p></div>
                        </div>
                        <div id="universityProgress"></div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <!-- Global Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/demo-data.js"></script>

    <script src="../../js/utils/helpers.js"></script>
    <script src="../../js/utils/formatters.js"></script>
    <script src="../../js/utils/validators.js"></script>
    <script src="../../js/utils/storage.js"></script>
    <script src="../../js/utils/debounce.js"></script>
    <script src="../../js/utils/permissions.js"></script>

    <script src="../../js/components/toast.js"></script>
    <script src="../../js/components/modal.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/header.js"></script>
    <script src="../../js/components/table.js"></script>

    <script src="../../js/navigation.js"></script>
    <script src="../../js/pages/dashboard.js"></script>
</body>
</html>
