<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solution Proposals | University Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="university" data-active="proposals"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Research Proposals"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">University Solution Proposals</h2>
          <p class="page-subtitle">Submit research & technology proposals for approved challenges</p>
        </div>
        <button class="btn btn-primary" id="openCreatePropModal">+ Submit New Proposal</button>
      </div>

      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Proposal Title</th>
              <th>Target Challenge</th>
              <th>Estimated Budget (INR)</th>
              <th>Duration</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="proposalsTbody">
            <tr>
              <td colspan="6" style="text-align:center; padding:30px;">Loading proposals...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Create Proposal Modal -->
      <div class="modal-overlay" id="propModal">
        <div class="modal-card">
          <div class="modal-header">
            <h3 style="font-size:1.1rem; font-weight:800;">Submit Solution Proposal</h3>
            <button id="closePropModal" style="cursor:pointer; font-weight:800; font-size:1.2rem;">✕</button>
          </div>
          <form id="createProposalForm">
            <div class="modal-body">
              <div class="form-group">
                <label class="form-label">Target Challenge ObjectId <span class="required">*</span></label>
                <input type="text" id="propChallengeId" class="form-control" placeholder="Paste Challenge ObjectId" required />
              </div>
              <div class="form-group">
                <label class="form-label">Proposal Title <span class="required">*</span></label>
                <input type="text" id="propTitle" class="form-control" placeholder="e.g. Solar Bio-Filtration Unit for School Drinking Water" required />
              </div>
              <div class="form-group">
                <label class="form-label">Problem Statement Brief</label>
                <textarea id="propProblem" class="form-textarea" style="min-height:70px;" required></textarea>
              </div>
              <div class="form-group">
                <label class="form-label">Proposed Technical Solution & Methodology</label>
                <textarea id="propSolution" class="form-textarea" style="min-height:90px;" required></textarea>
              </div>
              <div class="form-grid-2">
                <div class="form-group">
                  <label class="form-label">Estimated Budget (INR)</label>
                  <input type="number" id="propBudget" class="form-control" placeholder="e.g. 150000" required />
                </div>
                <div class="form-group">
                  <label class="form-label">Duration (Months)</label>
                  <input type="number" id="propDuration" class="form-control" placeholder="e.g. 6" required />
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" id="cancelPropModal">Cancel</button>
              <button type="submit" class="btn btn-primary">Submit Proposal</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Common.requireRole(['university', 'faculty', 'student', 'admin'])) return;

      const modal = document.getElementById('propModal');
      const openBtn = document.getElementById('openCreatePropModal');
      const closeBtn = document.getElementById('closePropModal');
      const cancelBtn = document.getElementById('cancelPropModal');

      openBtn.addEventListener('click', () => modal.classList.add('active'));
      closeBtn.addEventListener('click', () => modal.classList.remove('active'));
      cancelBtn.addEventListener('click', () => modal.classList.remove('active'));

      // Check URL parameters for challengeId prefill
      const params = new URLSearchParams(window.location.search);
      if (params.get('action') === 'create' && params.get('challengeId')) {
        document.getElementById('propChallengeId').value = params.get('challengeId');
        modal.classList.add('active');
      }

      try {
        const res = await API.get('/proposals');
        const tbody = document.getElementById('proposalsTbody');
        if (res.success && res.data && res.data.length > 0) {
          tbody.innerHTML = res.data.map(p => `
            <tr>
              <td class="table-title-cell">${Common.escapeHTML(p.title)}</td>
              <td>${Common.escapeHTML(p.challenge?.title || 'Target Challenge')}</td>
              <td>₹${Common.formatNumber(p.estimatedBudget || 0)}</td>
              <td>${p.durationInMonths || 1} Months</td>
              <td>${Components.renderStatusBadge(p.status)}</td>
              <td>
                <a href="proposal-details.html?id=${p._id}" class="btn btn-sm btn-outline">View Details</a>
              </td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="6">${Components.renderEmptyState('No Proposals Submitted', 'Submit your first solution proposal for an approved societal challenge.')}</td></tr>`;
        }
      } catch (err) {
        console.warn('Proposals fetch warning:', err.message);
      }

      document.getElementById('createProposalForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          const res = await API.post('/proposals', {
            challenge: document.getElementById('propChallengeId').value,
            title: document.getElementById('propTitle').value,
            problemStatement: document.getElementById('propProblem').value,
            proposedSolution: document.getElementById('propSolution').value,
            estimatedBudget: Number(document.getElementById('propBudget').value),
            durationInMonths: Number(document.getElementById('propDuration').value)
          });
          if (res.success) {
            Common.showToast('Proposal submitted successfully!', 'success');
            modal.classList.remove('active');
            setTimeout(() => location.reload(), 1000);
          }
        } catch (err) {
          Common.showToast(err.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
