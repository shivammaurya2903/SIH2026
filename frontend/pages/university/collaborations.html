<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaborations | University Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="university" data-active="collaborations"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Industry Collaborations"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">Industry & Startup Collaborations</h2>
          <p class="page-subtitle">Joint research, mentorship, prototyping, and funding partnerships</p>
        </div>
      </div>

      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Project / Challenge</th>
              <th>Industry Partner</th>
              <th>Collaboration Type</th>
              <th>Proposed Contribution</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="collabsTableBody">
            <tr>
              <td colspan="6" style="text-align:center; padding:30px;">Loading collaborations...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Common.requireRole(['university', 'faculty', 'student', 'admin'])) return;
      try {
        const res = await API.get('/collaborations');
        const tbody = document.getElementById('collabsTableBody');
        if (res.success && res.data && res.data.length > 0) {
          tbody.innerHTML = res.data.map(c => `
            <tr>
              <td class="table-title-cell">${Common.escapeHTML(c.project?.title || c.challenge?.title || 'Project')}</td>
              <td>${Common.escapeHTML(c.industry?.name || 'Industry Partner')}</td>
              <td><span class="badge badge-assigned">${Common.escapeHTML(c.type)}</span></td>
              <td>${Common.escapeHTML(c.proposedContribution || 'N/A')}</td>
              <td>${Components.renderStatusBadge(c.status)}</td>
              <td>
                ${c.status === 'pending' ? `
                  <button class="btn btn-sm btn-success" onclick="respondCollab('${c._id}', 'accept')">Accept</button>
                  <button class="btn btn-sm btn-danger" onclick="respondCollab('${c._id}', 'reject')">Reject</button>
                ` : '<span class="text-muted" style="font-size:0.8rem;">Completed</span>'}
              </td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="6">${Components.renderEmptyState('No Active Collaborations', 'Collaborations requested by industry partners will appear here.')}</td></tr>`;
        }
      } catch (err) {
        console.warn('Error loading collaborations:', err.message);
      }
    });

    async function respondCollab(id, action) {
      try {
        const res = await API.patch(`/collaborations/${id}/${action}`);
        if (res.success) {
          Common.showToast(`Collaboration ${action}ed successfully!`, 'success');
          setTimeout(() => location.reload(), 1000);
        }
      } catch (err) {
        Common.showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
