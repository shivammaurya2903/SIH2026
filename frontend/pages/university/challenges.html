<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Challenges | JharInnovate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/pages/challenges.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="dashboard-main">
            <header class="dashboard-header" id="header"></header>
            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <span class="section-label">OPPORTUNITIES</span>
                        <h1>Recommended Challenges</h1>
                        <p>Discover challenges matching your institution's expertise.</p>
                    </div>
                </div>
                <div class="filter-bar card">
                    <div class="search-field">
                        <i data-lucide="search"></i>
                        <input type="search" placeholder="Search challenges">
                    </div>
                    <select><option>All Domains</option><option>Agriculture</option><option>Healthcare</option><option>Education</option></select>
                    <select><option>Match Score</option><option>90%+</option><option>80%+</option><option>70%+</option></select>
                </div>
                <div class="challenge-grid" id="universityChallengeGrid"></div>
            </main>
        </div>
    </div>

    <script src="../../js/navigation.js"></script>
    <script src="../../js/pages/challenges.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
    </script>
</body>
</html>
