<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Challenges | JharInnovate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/pages/challenges.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="dashboard-main">
            <header class="dashboard-header" id="header"></header>

            <main class="dashboard-content">
                <div class="page-header">
                    <div>
                        <span class="section-label">OPPORTUNITIES</span>
                        <h1>Recommended Challenges</h1>
                        <p>Discover challenges matching your institution's R&D expertise.</p>
                    </div>
                </div>

                <div class="filter-bar card">
                    <div class="search-input">
                        <i data-lucide="search"></i>
                        <input type="search" id="challengeSearch" placeholder="Search challenges by keywords or category...">
                    </div>
                    <div class="filter-group">
                        <select id="domainFilter" class="filter-select">
                            <option value="">All Domains</option>
                            <option value="Agriculture">Agriculture</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Education">Education</option>
                            <option value="Water">Water</option>
                        </select>
                        <select id="statusFilter" class="filter-select">
                            <option value="">All Statuses</option>
                            <option value="Validated">Validated</option>
                            <option value="Assigned">Assigned</option>
                            <option value="In Progress">In Progress</option>
                        </select>
                    </div>
                </div>

                <div class="challenge-list" id="universityChallengeGrid"></div>
            </main>
        </div>
    </div>

    <!-- Global Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/demo-data.js"></script>

    <script src="../../js/utils/helpers.js"></script>
    <script src="../../js/utils/formatters.js"></script>
    <script src="../../js/utils/validators.js"></script>
    <script src="../../js/utils/storage.js"></script>
    <script src="../../js/utils/debounce.js"></script>
    <script src="../../js/utils/permissions.js"></script>

    <script src="../../js/components/toast.js"></script>
    <script src="../../js/components/modal.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/header.js"></script>
    <script src="../../js/components/table.js"></script>

    <script src="../../js/navigation.js"></script>
    <script src="../../js/pages/challenges.js"></script>
</body>
</html>
