<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge Marketplace | University Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="university" data-active="challenges"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Challenge Marketplace"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">Approved Societal Challenge Marketplace</h2>
          <p class="page-subtitle">Government-approved problems ready for university research proposals and team matching</p>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px;">
        <div style="display:flex; gap:16px; flex-wrap:wrap;">
          <input type="search" id="searchInput" class="form-control" placeholder="Search challenges by topic or district..." style="max-width:320px;" />
          <select id="categoryFilter" class="form-select" style="max-width:220px;">
            <option value="">All Categories</option>
            <option value="water">Water & Sanitation</option>
            <option value="education">Education & Digital Access</option>
            <option value="healthcare">Healthcare</option>
            <option value="agriculture">Agriculture & Farming</option>
            <option value="environment">Environment & Waste</option>
            <option value="energy">Clean Energy</option>
          </select>
        </div>
      </div>

      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Challenge Title</th>
              <th>Category</th>
              <th>District</th>
              <th>Priority Score</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="uniMarketplaceTbody">
            <tr>
              <td colspan="5" style="text-align:center; padding:30px;">Loading challenge marketplace...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Common.requireRole(['university', 'faculty', 'student', 'admin'])) return;
      try {
        const res = await API.get('/challenges?status=approved');
        const tbody = document.getElementById('uniMarketplaceTbody');

        if (res.success && res.data) {
          const challenges = res.data;

          const render = (items) => {
            if (!items || items.length === 0) {
              tbody.innerHTML = `<tr><td colspan="5">${Components.renderEmptyState('No Approved Challenges Available', 'Check back soon for new government-approved challenges.')}</td></tr>`;
              return;
            }

            tbody.innerHTML = items.map(ch => `
              <tr>
                <td class="table-title-cell">
                  <a href="challenge-details.html?id=${ch._id}" style="color:var(--text-main); font-weight:700;">
                    ${Common.escapeHTML(ch.title)}
                  </a>
                </td>
                <td><span class="badge badge-assigned">${Common.escapeHTML(ch.category)}</span></td>
                <td>${Common.escapeHTML(ch.location?.district || 'Jharkhand')}</td>
                <td><strong>${ch.aiAnalysis?.priorityScore || 50}</strong> / 100</td>
                <td>
                  <a href="challenge-details.html?id=${ch._id}" class="btn btn-sm btn-primary">Inspect & Submit Proposal</a>
                </td>
              </tr>
            `).join('');
          };

          render(challenges);

          document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            render(challenges.filter(c => c.title.toLowerCase().includes(query) || (c.location?.district || '').toLowerCase().includes(query)));
          });

          document.getElementById('categoryFilter').addEventListener('change', (e) => {
            const cat = e.target.value;
            render(cat ? challenges.filter(c => c.category === cat) : challenges);
          });
        }
      } catch (err) {
        console.warn('Marketplace error:', err.message);
      }
    });
  </script>
</body>
</html>
