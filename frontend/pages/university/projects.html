<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Projects | University Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="university" data-active="projects"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="R&D Projects Workspace"></header>
    <main class="app-content">
      <div class="page-header-block">
        <div>
          <h2 class="page-title">Active R&D Innovation Projects</h2>
          <p class="page-subtitle">Projects converted from approved proposals. Track prototyping, pilot testing, and state deployment</p>
        </div>
      </div>

      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>Project Title</th>
              <th>Industry Partner</th>
              <th>Lifecycle Stage</th>
              <th>Allocated Budget (INR)</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="uniProjectsTbody">
            <tr>
              <td colspan="5" style="text-align:center; padding:30px;">Loading projects...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Common.requireRole(['university', 'faculty', 'student', 'admin'])) return;
      try {
        const res = await API.get('/projects');
        const tbody = document.getElementById('uniProjectsTbody');
        if (res.success && res.data && res.data.length > 0) {
          tbody.innerHTML = res.data.map(p => `
            <tr>
              <td class="table-title-cell">${Common.escapeHTML(p.title)}</td>
              <td>${Common.escapeHTML(p.industry?.name || 'Pending Match')}</td>
              <td>${Components.renderStatusBadge(p.status)}</td>
              <td>₹${Common.formatNumber(p.budget?.allocated || 0)}</td>
              <td>
                <a href="project-details.html?id=${p._id}" class="btn btn-sm btn-outline">Project Workspace</a>
              </td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="5">${Components.renderEmptyState('No Active Projects', 'When government officers approve your proposals, active projects will be created here.')}</td></tr>`;
        }
      } catch (err) {
        console.warn(err.message);
      }
    });
  </script>
</body>
</html>
