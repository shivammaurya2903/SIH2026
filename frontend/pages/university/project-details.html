<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details | University Portal</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/components.js"></script>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="appSidebar" data-role="university" data-active="projects"></aside>
  <div class="app-main">
    <header class="app-header" id="appHeader" data-title="Project Workspace"></header>
    <main class="app-content">
      <div id="breadcrumbContainer"></div>
      <div id="projectDetailCard">
        <div style="text-align:center; padding:40px;">Loading project workspace...</div>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Common.requireRole(['university', 'faculty', 'student', 'admin'])) return;
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        window.location.href = 'projects.html';
        return;
      }

      document.getElementById('breadcrumbContainer').innerHTML = Components.renderBreadcrumb([
        { label: 'Projects', href: 'projects.html' },
        { label: 'Project View' }
      ]);

      try {
        const res = await API.get(`/projects/${id}`);
        const card = document.getElementById('projectDetailCard');
        if (res.success && res.data) {
          const prj = res.data;
          card.innerHTML = `
            <div class="card" style="margin-bottom:20px;">
              <div class="card-header">
                <div>
                  <h2 style="font-size:1.4rem;">${Common.escapeHTML(prj.title)}</h2>
                  <p style="font-size:0.85rem; color:var(--text-muted);">Target Challenge: ${Common.escapeHTML(prj.challenge?.title || 'Societal Problem')}</p>
                </div>
                <div>${Components.renderStatusBadge(prj.status)}</div>
              </div>
              <p style="font-size:0.95rem; margin-bottom:20px;">${Common.escapeHTML(prj.description)}</p>

              ${Components.renderTimeline(prj.status)}

              <div class="kpi-grid" style="margin-top:24px;">
                <div class="kpi-card">
                  <div class="kpi-icon">🎓</div>
                  <div>
                    <div class="kpi-value" style="font-size:1rem;">${Common.escapeHTML(prj.university?.name || 'Academic Institution')}</div>
                    <div class="kpi-label">Lead Institution</div>
                  </div>
                </div>
                <div class="kpi-card">
                  <div class="kpi-icon">🏢</div>
                  <div>
                    <div class="kpi-value" style="font-size:1rem;">${Common.escapeHTML(prj.industry?.name || 'Pending Partner')}</div>
                    <div class="kpi-label">Industry Partner</div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }
      } catch (err) {
        Common.showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
