<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="pageTitle">Access Denied — JharInnovate / SamadhanSetu</title>
  <style>
    :root {
      --primary: #1D4ED8;
      --primary-dark: #172554;
      --primary-light: #EFF6FF;
      --background: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --text-muted: #475569;
      --danger: #DC2626;
      --radius-lg: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--background); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

    .top-bar { position: absolute; top: 20px; right: 20px; }
    .lang-toggle { background: var(--surface); color: var(--primary); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--primary); font-weight: 800; cursor: pointer; font-size: 12px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 40px; text-align: center; max-width: 480px; width: 100%; box-shadow: 0 10px 25px rgba(15,23,42,0.1); }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 20px; border-radius: 8px; font-weight: 800; font-size: 14px; text-decoration: none; background: var(--primary); color: white; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="lang-toggle" onclick="toggleLanguage()" id="langToggleBtn">EN | हिंदी</button>
  </div>

  <div class="card">
    <div style="font-size: 56px; margin-bottom: 12px;">🚫</div>
    <h1 style="font-size: 24px; font-weight: 900; color: var(--danger); margin-bottom: 8px;" data-i18n="head.title">403 — Access Restricted</h1>
    <p style="font-size: 14px; color: var(--text-muted); line-height: 1.5;" data-i18n="head.sub">
      You do not have the required role authorization to access this dashboard.
    </p>
    <div style="display: flex; gap: 12px; justify-content: center; margin-top: 20px;">
      <button onclick="window.history.back()" class="btn btn-secondary" style="background: var(--surface); color: var(--text); border: 1px solid var(--border);" data-i18n="btn.back">← Go Back</button>
      <button onclick="goToUserDashboard()" class="btn" data-i18n="btn.dashboard">Go to My Dashboard →</button>
    </div>
  </div>

  <script>
    const CONFIG = { STORAGE_KEYS: { LANG: 'jhar_language' } };

    const I18N = {
      en: {
        pageTitle: 'Access Denied — JharInnovate / SamadhanSetu',
        head: { title: '403 — Access Restricted', sub: 'You do not have the required role authorization to access this dashboard.' },
        btn: { home: 'Return to Home →' }
      },
      hi: {
        pageTitle: 'पहुंच अस्वीकृत — झारइन्नोवेट / समाधानसेतु',
        head: { title: '403 — पहुंच प्रतिबंधित', sub: 'आपके पास इस डैशबोर्ड तक पहुंचने के लिए आवश्यक भूमिका अधिकार नहीं है।' },
        btn: { home: 'होम पर वापस जाएं →' }
      }
    };

    function getLanguage() { return localStorage.getItem(CONFIG.STORAGE_KEYS.LANG) || 'en'; }
    function t(key) {
      const lang = getLanguage();
      const keys = key.split('.');
      let obj = I18N[lang] || I18N['en'];
      for (const k of keys) {
        if (!obj || obj[k] === undefined) return key;
        obj = obj[k];
      }
      return obj;
    }
    function applyLanguage(lang) {
      const currentLang = lang || getLanguage();
      localStorage.setItem(CONFIG.STORAGE_KEYS.LANG, currentLang);
      document.documentElement.lang = currentLang;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const val = t(key);
        if (val && val !== key) el.textContent = val;
      });

      const toggleBtn = document.getElementById('langToggleBtn');
      if (toggleBtn) toggleBtn.textContent = currentLang === 'en' ? 'EN | हिंदी' : 'हिंदी | EN';
    }
    function toggleLanguage() {
      applyLanguage(getLanguage() === 'en' ? 'hi' : 'en');
    }

    function goToUserDashboard() {
      try {
        const user = JSON.parse(localStorage.getItem('jhar_user') || '{}');
        const roleMap = {
          citizen: 'citizen-dashboard.html',
          government: 'government-dashboard.html',
          university: 'university-dashboard.html',
          faculty: 'faculty-dashboard.html',
          student: 'student-dashboard.html',
          industry: 'industry-dashboard.html',
          admin: 'admin-dashboard.html'
        };
        window.location.href = roleMap[user.role] || 'index.html';
      } catch (err) {
        window.location.href = 'index.html';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyLanguage(getLanguage());
    });
  </script>
</body>
</html>
