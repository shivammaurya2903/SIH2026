<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="pageTitle">System Admin Console — SamadhanSetu</title>
  <style>
    :root {
      --primary: #1D4ED8;
      --primary-dark: #172554;
      --primary-light: #EFF6FF;
      --background: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --text-muted: #475569;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--background); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    .civic-nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--primary-dark); }
    .brand-logo { width: 36px; height: 36px; background: var(--primary); color: white; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 900; }

    .container { max-width: 1000px; margin: 24px auto; padding: 0 20px; width: 100%; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 24px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-md); font-weight: 700; font-size: 13px; text-decoration: none; border: 1px solid transparent; cursor: pointer; }
    .btn-secondary { background: var(--background); color: var(--text); border-color: var(--border); }
    .lang-toggle { background: var(--primary-light); color: var(--primary); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--primary); font-weight: 800; cursor: pointer; font-size: 12px; }

    .civic-footer { background: var(--surface); border-top: 1px solid var(--border); padding: 20px; text-align: center; margin-top: auto; font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>

  <nav class="civic-nav">
    <a href="index.html" class="brand">
      <div class="brand-logo">A</div>
      <div>
        <div style="font-weight: 900; font-size: 18px;">SamadhanSetu</div>
        <div style="font-size: 10px; color: var(--text-muted); font-weight: 700;" data-i18n="nav.subtitle">SYSTEM ADMIN CONSOLE</div>
      </div>
    </a>
    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="lang-toggle" onclick="toggleLanguage()" id="langToggleBtn">EN | हिंदी</button>
      <button class="btn btn-secondary" onclick="logout()" data-i18n="logout">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h1 style="font-size: 22px; font-weight: 900; color: var(--primary-dark); margin-bottom: 6px;" data-i18n="head.title">System Security & User Governance</h1>
      <p style="font-size: 14px; color: var(--text-muted);" data-i18n="head.sub">Manage platform roles, inspect audit logs, and configure RBAC policies.</p>
    </div>

    <div class="card">
      <h2 style="font-size: 18px; font-weight: 800; color: var(--primary-dark); margin-bottom: 16px;" data-i18n="stats.title">System Overview</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px;">
        <div style="padding: 16px; background: var(--background); border-radius: var(--radius-md); text-align: center;">
          <div style="font-size: 24px; font-weight: 900; color: var(--primary);">2,840</div>
          <div style="font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-top: 4px;" data-i18n="stats.users">Registered Users</div>
        </div>
        <div style="padding: 16px; background: var(--background); border-radius: var(--radius-md); text-align: center;">
          <div style="font-size: 24px; font-weight: 900; color: var(--accent);">100%</div>
          <div style="font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-top: 4px;" data-i18n="stats.rbac">RBAC Enforced</div>
        </div>
      </div>
    </div>
  </div>

  <footer class="civic-footer">
    <div data-i18n="footer.copy">&copy; 2026 SamadhanSetu — System Admin Console</div>
  </footer>

  <script>
    const CONFIG = { STORAGE_KEYS: { TOKEN: 'jhar_token', USER: 'jhar_user', LANG: 'jhar_language' } };

    const I18N = {
      en: {
        pageTitle: 'System Admin Console — SamadhanSetu',
        nav: { subtitle: 'SYSTEM ADMIN CONSOLE' },
        logout: 'Logout',
        head: { title: 'System Security & User Governance', sub: 'Manage platform roles, inspect audit logs, and configure RBAC policies.' },
        stats: { title: 'System Overview', users: 'Registered Users', rbac: 'RBAC Enforced' },
        footer: { copy: '© 2026 SamadhanSetu — System Admin Console' }
      },
      hi: {
        pageTitle: 'सिस्टम व्यवस्थापक कंसोल — झारइन्नोवेट / समाधानसेतु',
        nav: { subtitle: 'सिस्टम एडमिन कंसोल' },
        logout: 'लॉग आउट',
        head: { title: 'सिस्टम सुरक्षा और उपयोगकर्ता शासन', sub: 'मंच भूमिकाओं को प्रबंधित करें, ऑडिट लॉग का निरीक्षण करें और आरबीएसी नीतियों को कॉन्फ़िगर करें।' },
        stats: { title: 'सिस्टम अवलोकन', users: 'पंजीकृत उपयोगकर्ता', rbac: 'आरबीएसी लागू' },
        footer: { copy: '© 2026 झारइन्नोवेट / समाधानसेतु — सिस्टम एडमिन कंसोल' }
      }
    };

    function getLanguage() { return localStorage.getItem(CONFIG.STORAGE_KEYS.LANG) || 'en'; }
    function t(key) {
      const lang = getLanguage();
      const keys = key.split('.');
      let obj = I18N[lang] || I18N['en'];
      for (const k of keys) {
        if (!obj || obj[k] === undefined) return key;
        obj = obj[k];
      }
      return obj;
    }
    function applyLanguage(lang) {
      const currentLang = lang || getLanguage();
      localStorage.setItem(CONFIG.STORAGE_KEYS.LANG, currentLang);
      document.documentElement.lang = currentLang;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const val = t(key);
        if (val && val !== key) el.textContent = val;
      });

      const toggleBtn = document.getElementById('langToggleBtn');
      if (toggleBtn) toggleBtn.textContent = currentLang === 'en' ? 'EN | हिंदी' : 'हिंदी | EN';
    }
    function toggleLanguage() {
      applyLanguage(getLanguage() === 'en' ? 'hi' : 'en');
    }

    function logout() {
      localStorage.removeItem(CONFIG.STORAGE_KEYS.TOKEN);
      localStorage.removeItem(CONFIG.STORAGE_KEYS.USER);
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem(CONFIG.STORAGE_KEYS.TOKEN);
      if (!token) { window.location.href = 'login.html'; return; }
      applyLanguage(getLanguage());
    });
  </script>
</body>
</html>
