<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="pageTitle">University R&D Portal — JharInnovate / SamadhanSetu</title>
  <script src="categories.js"></script>
  <style>
    :root {
      --primary: #1D4ED8;
      --primary-dark: #172554;
      --primary-light: #EFF6FF;
      --accent: #F59E0B;
      --background: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --text-muted: #475569;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
      --shadow-md: 0 4px 12px rgba(15,23,42,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--background); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    .civic-nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--primary-dark); }
    .brand-logo { width: 36px; height: 36px; background: var(--primary); color: white; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 900; }

    .container { max-width: 1000px; margin: 24px auto; padding: 0 20px; width: 100%; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); }
    .kpi-val { font-size: 28px; font-weight: 900; color: var(--primary-dark); }
    .kpi-lbl { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; }

    .section-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 24px; }
    .card-title { font-size: 18px; font-weight: 800; color: var(--primary-dark); margin-bottom: 16px; }

    .match-list { display: flex; flex-direction: column; gap: 12px; }
    .match-item { background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-md); font-weight: 700; font-size: 13px; text-decoration: none; border: 1px solid transparent; cursor: pointer; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: var(--background); color: var(--text); border-color: var(--border); }
    .lang-toggle { background: var(--primary-light); color: var(--primary); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--primary); font-weight: 800; cursor: pointer; font-size: 12px; }

    .civic-footer { background: var(--surface); border-top: 1px solid var(--border); padding: 20px; text-align: center; margin-top: auto; font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>

  <nav class="civic-nav">
    <a href="index.html" class="brand">
      <div class="brand-logo">U</div>
      <div>
        <div style="font-weight: 900; font-size: 18px;">JharInnovate</div>
        <div style="font-size: 10px; color: var(--text-muted); font-weight: 700;" data-i18n="nav.subtitle">UNIVERSITY R&D HUB</div>
      </div>
    </a>
    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="lang-toggle" onclick="toggleLanguage()" id="langToggleBtn">EN | हिंदी</button>
      <a href="profile.html" class="btn btn-secondary" data-i18n="nav.profile">R&D Profile</a>
      <button class="btn btn-secondary" onclick="logout()" data-i18n="logout">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div class="kpi-grid">
      <div class="kpi-card" style="background: #EFF6FF;">
        <div class="kpi-val" style="color: #1D4ED8;" id="kpiMatched">12</div>
        <div class="kpi-lbl" data-i18n="kpi.matched">AI Matched Challenges</div>
      </div>
      <div class="kpi-card" style="background: #EEF2FF;">
        <div class="kpi-val" style="color: #4F46E5;" id="kpiProposals">4</div>
        <div class="kpi-lbl" data-i18n="kpi.submitted">Proposals Submitted</div>
      </div>
      <div class="kpi-card" style="background: #FEF3C7;">
        <div class="kpi-val" style="color: #b45309;" id="kpiActive">2</div>
        <div class="kpi-lbl" data-i18n="kpi.active">Active R&D Projects</div>
      </div>
    </div>

    <div class="section-card">
      <h2 class="card-title" data-i18n="matches.title">Recommended Societal Challenges (AI Matched)</h2>
      <div class="match-list" id="matchesContainer">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <footer class="civic-footer">
    <div data-i18n="footer.copy">&copy; 2026 JharInnovate / SamadhanSetu — Academic R&D Hub</div>
  </footer>

  <script>
    const CONFIG = {
      API_BASE_URL: window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:5000/api' : '/api',
      STORAGE_KEYS: { TOKEN: 'jhar_token', USER: 'jhar_user', LANG: 'jhar_language' }
    };

    const I18N = {
      en: {
        pageTitle: 'University R&D Portal — JharInnovate / SamadhanSetu',
        nav: { subtitle: 'UNIVERSITY R&D HUB', profile: 'R&D Profile' },
        logout: 'Logout',
        kpi: { matched: 'AI Matched Challenges', submitted: 'Proposals Submitted', active: 'Active R&D Projects' },
        matches: { title: 'Recommended Societal Challenges (AI Matched)' },
        btn: { submitProposal: 'Submit R&D Proposal', viewDetails: 'Details →' },
        footer: { copy: '© 2026 JharInnovate / SamadhanSetu — Academic R&D Hub' }
      },
      hi: {
        pageTitle: 'विश्वविद्यालय आरएंडडी पोर्टल — झारइन्नोवेट / समाधानसेतु',
        nav: { subtitle: 'विश्वविद्यालय आरएंडडी हब', profile: 'आरएंडडी प्रोफ़ाइल' },
        logout: 'लॉग आउट',
        kpi: { matched: 'एआई-मिलान वाली चुनौतियां', submitted: 'प्रस्तुत प्रस्ताव', active: 'सक्रिय आरएंडडी परियोजनाएं' },
        matches: { title: 'अनुशंसित सामाजिक चुनौतियां (एआई मिलान)' },
        btn: { submitProposal: 'आरएंडडी प्रस्ताव जमा करें', viewDetails: 'विवरण →' },
        footer: { copy: '© 2026 झारइन्नोवेट / समाधानसेतु — अकादमिक आरएंडडी हब' }
      }
    };

    function getLanguage() { return localStorage.getItem(CONFIG.STORAGE_KEYS.LANG) || 'en'; }
    function t(key) {
      const lang = getLanguage();
      const keys = key.split('.');
      let obj = I18N[lang] || I18N['en'];
      for (const k of keys) {
        if (!obj || obj[k] === undefined) return key;
        obj = obj[k];
      }
      return obj;
    }
    function applyLanguage(lang) {
      const currentLang = lang || getLanguage();
      localStorage.setItem(CONFIG.STORAGE_KEYS.LANG, currentLang);
      document.documentElement.lang = currentLang;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const val = t(key);
        if (val && val !== key) el.textContent = val;
      });

      const toggleBtn = document.getElementById('langToggleBtn');
      if (toggleBtn) toggleBtn.textContent = currentLang === 'en' ? 'EN | हिंदी' : 'हिंदी | EN';

      loadUniversityData();
    }
    function toggleLanguage() {
      applyLanguage(getLanguage() === 'en' ? 'hi' : 'en');
    }

    function logout() {
      localStorage.removeItem(CONFIG.STORAGE_KEYS.TOKEN);
      localStorage.removeItem(CONFIG.STORAGE_KEYS.USER);
      window.location.href = 'login.html';
    }

    async function loadUniversityData() {
      const token = localStorage.getItem(CONFIG.STORAGE_KEYS.TOKEN);
      if (!token) return;

      try {
        const res = await fetch(`${CONFIG.API_BASE_URL}/challenges`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();

        if (res.ok && data.success && data.data) {
          const list = data.data;
          const container = document.getElementById('matchesContainer');

          container.innerHTML = list.slice(0, 6).map(c => `
            <div class="match-item">
              <div>
                <div style="font-weight: 800; font-size: 15px; color: var(--primary-dark);">${c.title}</div>
                <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">
                  ${typeof getCategoryLabel === 'function' ? getCategoryLabel(c.category, getLanguage()) : (c.category || 'General')} • AI Capability Match: <strong style="color: var(--primary);">94% Match</strong>
                </div>
              </div>
              <div style="display: flex; gap: 8px;">
                <a href="challenge.html?id=${c._id}" class="btn btn-secondary">${t('btn.viewDetails')}</a>
                <button class="btn btn-primary" onclick="alert('${getLanguage() === 'hi' ? 'प्रस्ताव जमा करें कार्यप्रवाह शुरू हो गया है' : 'Submit proposal workflow triggered'}')">${t('btn.submitProposal')}</button>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem(CONFIG.STORAGE_KEYS.TOKEN);
      if (!token) {
        window.location.href = 'login.html';
        return;
      }
      applyLanguage(getLanguage());
    });
  </script>
</body>
</html>
