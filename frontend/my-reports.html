<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="pageTitle">My Reports & Tracking — JharInnovate / SamadhanSetu</title>
  <script src="categories.js"></script>
  <style>
    :root {
      --primary: #1D4ED8;
      --primary-dark: #172554;
      --primary-light: #EFF6FF;
      --accent: #F59E0B;
      --background: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #0F172A;
      --text-muted: #475569;
      --success: #2563EB;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--background); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    .civic-nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--primary-dark); }
    .brand-logo { width: 36px; height: 36px; background: var(--primary); color: white; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 900; }

    .container { max-width: 900px; margin: 24px auto; padding: 0 20px; width: 100%; }

    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .page-title { font-size: 24px; font-weight: 900; color: var(--primary-dark); }

    .report-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
    .report-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
    .report-title { font-size: 18px; font-weight: 800; color: var(--primary-dark); }
    .report-id { font-size: 12px; font-weight: 800; color: var(--primary); background: var(--primary-light); padding: 2px 8px; border-radius: 4px; }
    
    .timeline { display: flex; justify-content: space-between; margin: 20px 0 16px; position: relative; }
    .timeline::before { content: ''; position: absolute; top: 10px; left: 0; right: 0; height: 2px; background: var(--border); z-index: 1; }
    .t-step { position: relative; z-index: 2; background: var(--surface); text-align: center; font-size: 10px; font-weight: 700; color: var(--text-muted); padding: 0 4px; }
    .t-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); margin: 0 auto 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; }
    .t-step.done .t-dot { background: var(--primary); border-color: var(--primary); color: white; }
    .t-step.active .t-dot { background: var(--accent); border-color: var(--accent); color: white; }

    .report-actions { display: flex; justify-content: space-between; align-items: center; pt-3; border-top: 1px solid var(--border); padding-top: 12px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-md); font-weight: 700; font-size: 13px; text-decoration: none; border: 1px solid transparent; cursor: pointer; }
    .btn-secondary { background: var(--background); color: var(--text); border-color: var(--border); }
    .btn-primary { background: var(--primary); color: white; }
    .lang-toggle { background: var(--primary-light); color: var(--primary); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--primary); font-weight: 800; cursor: pointer; font-size: 12px; }

    .civic-footer { background: var(--surface); border-top: 1px solid var(--border); padding: 20px; text-align: center; margin-top: auto; font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>

  <nav class="civic-nav">
    <a href="index.html" class="brand">
      <div class="brand-logo">J</div>
      <div>
        <div style="font-weight: 900; font-size: 18px;">JharInnovate</div>
        <div style="font-size: 10px; color: var(--text-muted); font-weight: 700;" data-i18n="nav.subtitle">MY REPORTS & TRACKING</div>
      </div>
    </a>
    <div style="display: flex; gap: 10px;">
      <button class="lang-toggle" onclick="toggleLanguage()" id="langToggleBtn">EN | हिंदी</button>
      <a href="citizen-dashboard.html" class="btn btn-secondary" data-i18n="nav.back">← Dashboard</a>
    </div>
  </nav>

  <div class="container">
    <div class="header-bar">
      <div>
        <h1 class="page-title" data-i18n="head.title">My Reported Problems</h1>
        <div style="font-size: 13px; color: var(--text-muted);" data-i18n="head.sub">Real-time 6-stage lifecycle tracking for your submitted community issues.</div>
      </div>
      <a href="report-problem.html" class="btn btn-primary" data-i18n="head.cta">+ Report Problem</a>
    </div>

    <div id="reportsList">
      <!-- Rendered by JS -->
    </div>
  </div>

  <footer class="civic-footer">
    <div data-i18n="footer.copy">&copy; 2026 JharInnovate / SamadhanSetu — Problem Resolution Tracker</div>
  </footer>

  <script>
    const CONFIG = {
      API_BASE_URL: window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:5000/api' : '/api',
      STORAGE_KEYS: { TOKEN: 'jhar_token', USER: 'jhar_user', LANG: 'jhar_language' }
    };

    const I18N = {
      en: {
        pageTitle: 'My Reports & Tracking — JharInnovate / SamadhanSetu',
        nav: { subtitle: 'MY REPORTS & TRACKING', back: '← Dashboard' },
        head: { title: 'My Reported Problems', sub: 'Real-time 6-stage lifecycle tracking for your submitted community issues.', cta: '+ Report Problem' },
        timeline: { step1: 'Submitted', step2: 'Verified', step3: 'Gov Review', step4: 'Uni/Industry', step5: 'Solution', step6: 'Resolved' },
        card: { affected: '👍 347 citizens affected', confirmBtn: 'Confirm Resolution', fullDetails: 'Full Details →', noReports: 'No Reports Found', noReportsSub: "You haven't reported any community issues yet.", reportCta: 'Report a Problem Now' },
        footer: { copy: '© 2026 JharInnovate / SamadhanSetu — Problem Resolution Tracker' }
      },
      hi: {
        pageTitle: 'मेरी रिपोर्टें और ट्रैकिंग — झारइन्नोवेट / समाधानसेतु',
        nav: { subtitle: 'मेरी रिपोर्टें और ट्रैकिंग', back: '← डैशबोर्ड' },
        head: { title: 'मेरी दर्ज समस्याएं', sub: 'आपकी प्रस्तुत सामुदायिक समस्याओं के लिए वास्तविक समय 6-चरण जीवनचक्र ट्रैकिंग।', cta: '+ समस्या दर्ज करें' },
        timeline: { step1: 'जमा हुआ', step2: 'सत्यापित', step3: 'सरकारी समीक्षा', step4: 'विश्वविद्यालय/उद्योग', step5: 'समाधान', step6: 'हल किया गया' },
        card: { affected: '👍 347 नागरिक प्रभावित', confirmBtn: 'समाधान की पुष्टि करें', fullDetails: 'पूर्ण विवरण →', noReports: 'कोई रिपोर्ट नहीं मिली', noReportsSub: 'आपने अभी तक कोई सामुदायिक समस्या दर्ज नहीं की है।', reportCta: 'अब समस्या दर्ज करें' },
        footer: { copy: '© 2026 झारइन्नोवेट / समाधानसेतु — समस्या समाधान ट्रैकर' }
      }
    };

    function getLanguage() { return localStorage.getItem(CONFIG.STORAGE_KEYS.LANG) || 'en'; }
    function t(key) {
      const lang = getLanguage();
      const keys = key.split('.');
      let obj = I18N[lang] || I18N['en'];
      for (const k of keys) {
        if (!obj || obj[k] === undefined) return key;
        obj = obj[k];
      }
      return obj;
    }
    function applyLanguage(lang) {
      const currentLang = lang || getLanguage();
      localStorage.setItem(CONFIG.STORAGE_KEYS.LANG, currentLang);
      document.documentElement.lang = currentLang;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const val = t(key);
        if (val && val !== key) el.textContent = val;
      });

      const toggleBtn = document.getElementById('langToggleBtn');
      if (toggleBtn) toggleBtn.textContent = currentLang === 'en' ? 'EN | हिंदी' : 'हिंदी | EN';

      loadReportsList();
    }
    function toggleLanguage() {
      applyLanguage(getLanguage() === 'en' ? 'hi' : 'en');
    }

    function getUser() {
      const raw = localStorage.getItem(CONFIG.STORAGE_KEYS.USER);
      if (!raw) return null;
      try {
        const u = JSON.parse(raw);
        if (u) {
          if (!u.id && u._id) u.id = String(u._id);
          if (!u._id && u.id) u._id = String(u.id);
        }
        return u;
      } catch (e) { return null; }
    }

    async function loadReportsList() {
      const token = localStorage.getItem(CONFIG.STORAGE_KEYS.TOKEN);
      const user = getUser();
      if (!token || !user) return;

      try {
        const res = await fetch(`${CONFIG.API_BASE_URL}/challenges`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (typeof handleAuthError === 'function' && handleAuthError(res, data)) {
          return;
        }
        const listContainer = document.getElementById('reportsList');

        if (res.ok && data.success && data.data) {
          const list = data.data.filter(c => {
            if (!c.submittedBy) return false;
            const subId = typeof c.submittedBy === 'object' ? (c.submittedBy._id || c.submittedBy.id) : String(c.submittedBy);
            return subId === String(user.id) || subId === String(user._id);
          });

          if (list.length === 0) {
            listContainer.innerHTML = `
              <div style="background: var(--surface); padding: 48px; border-radius: var(--radius-lg); border: 1px solid var(--border); text-align: center; color: var(--text-muted);">
                <div style="font-size: 40px; margin-bottom: 12px;">📂</div>
                <div style="font-size: 18px; font-weight: 800; color: var(--primary-dark);">${t('card.noReports')}</div>
                <p style="font-size: 13px; margin: 6px 0 20px;">${t('card.noReportsSub')}</p>
                <a href="report-problem.html" class="btn btn-primary">${t('card.reportCta')}</a>
              </div>
            `;
          } else {
            listContainer.innerHTML = list.map(item => `
              <div class="report-card">
                <div class="report-header">
                  <div>
                    <div class="report-title">${item.title}</div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">
                      ${typeof getCategoryLabel === 'function' ? getCategoryLabel(item.category, getLanguage()) : (item.category || 'General')} • 📍 <strong>${item.location?.district || 'Ranchi'}</strong> ${item.location?.block ? '• ' + item.location.block : ''} • Submitted: ${item.createdAt ? new Date(item.createdAt).toLocaleDateString() : 'Recent'}
                    </div>
                  </div>
                  <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                    <span class="report-id">${item.challengeId || ('CH-' + item._id.substring(0, 6).toUpperCase())}</span>
                    <span style="font-size: 10px; font-weight: 800; text-transform: uppercase; background: #FEF3C7; color: #b45309; padding: 2px 6px; border-radius: 4px;">${item.priority || 'medium'} priority</span>
                  </div>
                </div>

                <div class="timeline">
                  <div class="t-step done">
                    <div class="t-dot">✓</div>
                    <span>${t('timeline.step1')}</span>
                  </div>
                  <div class="t-step ${item.status !== 'submitted' ? 'done' : 'active'}">
                    <div class="t-dot">${item.status !== 'submitted' ? '✓' : '•'}</div>
                    <span>${t('timeline.step2')}</span>
                  </div>
                  <div class="t-step ${item.status === 'approved' || item.status === 'in_project' || item.status === 'completed' ? 'done' : ''}">
                    <div class="t-dot">•</div>
                    <span>${t('timeline.step3')}</span>
                  </div>
                  <div class="t-step ${item.status === 'in_project' || item.status === 'completed' ? 'done' : ''}">
                    <div class="t-dot">•</div>
                    <span>${t('timeline.step4')}</span>
                  </div>
                  <div class="t-step ${item.status === 'completed' ? 'done' : ''}">
                    <div class="t-dot">•</div>
                    <span>${t('timeline.step5')}</span>
                  </div>
                  <div class="t-step ${item.status === 'completed' ? 'done' : ''}">
                    <div class="t-dot">•</div>
                    <span>${t('timeline.step6')}</span>
                  </div>
                </div>

                <div class="report-actions">
                  <span style="font-size: 12px; font-weight: 700; color: var(--primary);">
                    ${t('card.affected')}
                  </span>
                  <div style="display: flex; gap: 8px;">
                    <button class="btn btn-secondary" onclick="alert('${getLanguage() === 'hi' ? 'समाधान स्थिति की पुष्टि करने के लिए धन्यवाद!' : 'Thank you for confirming resolution state!'}')">${t('card.confirmBtn')}</button>
                    <a href="challenge.html?id=${item._id}" class="btn btn-primary">${t('card.fullDetails')}</a>
                  </div>
                </div>
              </div>
            `).join('');
          }
        }
      } catch (err) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem(CONFIG.STORAGE_KEYS.TOKEN);
      const user = getUser();
      if (!token || !user) {
        window.location.href = 'login.html';
        return;
      }
      applyLanguage(getLanguage());
    });
  </script>
</body>
</html>
